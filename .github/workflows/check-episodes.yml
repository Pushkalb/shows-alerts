name: Check Episodes

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run episode checker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_episodes.py

      - name: Commit updated state
        run: |
          git config user.name "episode-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update episode state"
          git push
